<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAF7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--head:start-->
    <title>Qevnaro | Web Development, Digital Marketing &amp; AI Automation Agency in India</title>
    <meta name="description" content="Qevnaro is a technology and digital growth agency in Noida and Bengaluru. We build websites and apps, run SEO, GEO and paid campaigns, and automate operations with AI." />
    <!--head:end-->

    <!-- Brand intro, once per browser session: the mark draws and a counter runs to 100 in about a second.
         Desktop only; skipped on phones and for reduced motion so it never delays the first paint there. -->
    <script>
      try {
        var d = document.documentElement;
        if (!sessionStorage.getItem('qev_intro') && matchMedia('(pointer: fine) and (min-width: 1024px)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          sessionStorage.setItem('qev_intro', '1');
          d.classList.add('intro');
          var start = performance.now(), done = false, MIN = 1050;
          var finish = function () {
            if (done) return;
            done = true;
            d.classList.add('intro-done');
            dispatchEvent(new Event('qev:intro-done'));
          };
          var tick = function (now) {
            var e = now - start;
            var n = Math.min(100, Math.round((e / MIN) * 100));
            var c = document.getElementById('intro-count'), b = document.getElementById('intro-bar');
            if (c) c.textContent = String(n).padStart(3, '0');
            if (b) b.style.transform = 'scaleX(' + n / 100 + ')';
            if (n === 100) setTimeout(finish, 120); else requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        }
      } catch (e) {}
    </script>

    <!-- Without JavaScript, show content that would otherwise wait for a scroll animation -->
    <noscript>
      <style>
        #root [style] { opacity: 1 !important; transform: none !important; filter: none !important; }
        #qev-loader { display: none !important; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="qev-loader" aria-hidden="true">
      <svg viewBox="0 0 117 107" width="96" height="88">
        <path class="q" pathLength="1" d="M 0,32.1 L 0,74.2 L 54.9,106.9 L 76.2,93.5 L 64.9,81.1 L 54.4,86.5 L 17.8,64.9 L 17.1,42.4 L 54.5,20 L 93.4,42.9 L 93.4,63.8 L 70.9,78 L 93.5,103.5 L 116.8,103.8 L 98.3,81.7 L 109.9,74.4 L 109.9,31.8 L 54.8,0 Z" />
        <path class="c" d="M 25.5,60 L 60.5,40.1 L 85.1,68 L 70.5,76.5 L 57.2,62.8 L 40.9,71 Z" />
      </svg>
      <span class="word">Qevnaro</span>
      <span class="count" id="intro-count">000</span>
      <span class="bar" id="intro-bar"></span>
    </div>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
